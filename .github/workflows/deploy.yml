name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # SITE_URL 从仓库 Variables 读取（Settings → Secrets and variables → Variables）
    # 设为你的真实域名，例如 https://tool.example.com
    # 未设置时 astro.config.mjs 回退占位符，并在构建日志告警
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 首次部署时，Cloudflare Pages 项目可能还不存在；先尝试创建，已存在会报错并被忽略
      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages project create online-toolbox

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # 显式注入环境变量，确保 wrangler 在非交互环境一定能读到 token（绕过 action 输入传递在 Node 24 runner 上的坑）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=online-toolbox --commit-dirty=true
